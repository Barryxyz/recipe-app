# XcodeGen spec. Run `xcodegen` in ios/ to (re)generate Fridge.xcodeproj.
# The .xcodeproj is generated, so edit this file instead of the project in Xcode.
name: Fridge
options:
  bundleIdPrefix: com.barryxyz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Fridge:
    type: application
    platform: iOS
    sources:
      - path: Fridge
    configFiles:
      Debug: Config/Dev.xcconfig
      Release: Config/Prod.xcconfig
    dependencies:
      - package: Supabase
    info:
      path: Fridge/Info.plist
      properties:
        CFBundleDisplayName: Fridge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.barryxyz.fridge.refresh
        NSCameraUsageDescription: Fridge uses the camera to photograph your fridge, freezer or pantry so it can list the food inside. Photos aren't stored.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        ShareBaseURL: $(SHARE_BASE_URL)
        # F4.3: opens share links on builds without Universal Links (testing).
        CFBundleURLTypes:
          - CFBundleURLName: com.barryxyz.fridge.share
            CFBundleURLSchemes:
              - com.barryxyz.fridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barryxyz.fridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: V2KLBCFV26 # Barry Chin (Personal Team), free Apple ID

  FridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FridgeTests
      # Shared with the SQL tests (F1.6): both implementations run the same cases.
      - path: ../supabase/tests/expiry_cases.json
        buildPhase: resources
      # F0.6: local StoreKit products for the subscription tests (no App Store needed).
      - path: FridgeTests/StoreKit/Subscriptions.storekit
        buildPhase: resources
    dependencies:
      - target: Fridge
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barryxyz.fridge.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: V2KLBCFV26

schemes:
  Fridge:
    build:
      targets:
        Fridge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FridgeTests
